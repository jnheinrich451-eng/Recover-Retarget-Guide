census: census_v1 (2026-10-17)
category_rule: 'default: a vehicle word (car, bus, truck, jeep, rover, van, motorcycle, vehicle, carriage, cart, boat) as a whole word among the first five words of the caption -> vehicle (the red car);
  otherwise human (the man). Fixed before the census ran.'
set_rule: 'from the PASS rows, in clip-id order: the first 10 MiraData passes; every DAVIS pass. Fixed before the census ran; nothing added by hand afterwards.'
