    thirteen. Descriptive; no test.

process:
  intro: >
    How the method got here, in order, including what was tried and set aside. Each step says what the evidence was.
  steps:
    - title: "Lift the reference to three dimensions"
      status: kept
      text: "A frozen 3D tracker gives tracks, depth and a camera that is consistent inside one of its encoding windows; an external camera estimate is archived beside it with the scale ratio that ties the two. A drift model fitted on the static background tells static from moving."
      evidence: "The tracker's camera degrades across window boundaries by about four times; measured on the calibration clips, and the reason a third camera is solved later."
    - title: "A branch for clips where the camera follows the subject"
      status: kept
      text: "When the camera travels with the subject, the subject is nearly still in the shared frame and the ordinary proposal degenerates. A detector finds the quiet, compact blob of the subject and a separate branch composes its path with the camera."
      evidence: "The degeneracy was measured on the follow-camera calibration clip before the branch was designed."
    - title: "Per-frame drift correction of the camera"
      status: rejected
      text: "A per-frame scale correction of the camera was considered as a default."
      evidence: "On the calibration clips the drift it would remove is present on some and absent on others, so applying it throughout would introduce the error it is meant to remove."
    - title: "The anchor by depth-conditioned generation"
      status: kept
      text: "A category proxy is placed where the source subject stood, facing its heading on the recovered ground; a hybrid control depth drives a depth-conditioned image generator; the anchor is selected by a fixed rule with a facing test."
      evidence: "Automatic selection delivered all fifteen test anchors with one unclear subject, read by eye before any score."
    - title: "Road-layout conditioning of the anchor"
      status: tried, not adopted
      text: "On the camera-following clip the anchors placed the car on roads that did not afford its turn. The road's boundaries were added as a second spatial condition beside the depth."
      evidence: "The road's shape was kept on inspected examples, at the cost of appearance and generalisation, and the best inputs were traced by hand; the line was closed and Stage II left unchanged."
    - title: "Attention-readout guidance"
      status: built, set aside
      text: "The first guidance read a displacement field from one transformer block's attention and optimised the latent toward the displacement the geometry predicts, with an epipolar term where coverage was low."
      evidence: "On generated video the loss was satisfied by content rather than by motion. The readout stayed as an instrument: it was gated against CoTracker3 tracks on the source clips."
    - title: "The render-target correction"
      status: kept
      text: "The anchor's own content is rendered along the recovered camera, and the object along its path for rigid targets. Inside a window of noise levels the clean estimate is pulled toward the render where a mask holds; no gradient, one encode."
      evidence: "Camera rotation error falls on 15 of 15 test pairs (median 3.59 to 1.08 degrees), significant after Holm correction."
    - title: "A geometry refresh from the denoised estimate"
      status: designed, not built
      text: "Newly revealed background would be re-lifted from the decoded estimate at an anchor frame, so coverage would not decay over the video."
      evidence: "The rule that chooses the noise levels from the estimate's depth error returned an empty set: where the depth is usable the content has already changed. So coverage decays, and the late-frame distortion the review saw is left as future work."
    - title: "Which camera the generator consumes"
      status: changed
      text: "The development set ran on the external camera, bridged into the source gauge by a depth ratio at one frame and a second scalar read at the object. The final configuration solves the camera from the static tracks: perspective-n-point per frame, then a bundle adjustment, in the gauge of the lifted scene, so no bridge is needed."
      evidence: "Held-out static points reproject within a fraction of a patch through the refined cameras; the same test is the camera check every test pair passed."
    - title: "The sampler's details"
      status: kept, tested
      text: "The multistep scheduler's corrector is disabled at the corrected steps; the mask is soft at its edges; the sky at infinity is inside the mask with a rotation-only target."
      evidence: "In the guidance ablations the hard mask is worse on the subject's path on 5 of 5 pairs, the sky out is worse on the camera on 4 of 5, gamma between 0.25 and 1 is indistinguishable on five pairs, and a first-order sampler keeps the camera but hurts the subject."

