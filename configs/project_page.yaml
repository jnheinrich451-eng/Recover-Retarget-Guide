site:
  eyebrow: "Honours thesis · Australian National University · 2026"
  title: "Recover, Retarget, Guide"
  subtitle: "Camera and object motion transfer with a frozen video model"
  author: "John Zeng · supervisor Dr Jing Zhang"
  lead: >
    A reference video supplies a camera motion and a subject motion; a text prompt supplies a new subject in a new scene.
    The motion visible in the image mixes the two with the scene's depth, so copying image-plane displacement cannot separate
    the camera from the subject, and a displacement measured in the source scene need not fit the geometry of the new one.
    This work builds the motion target in the target scene before any video is generated, and corrects a frozen video
    generator toward it. Nothing is trained.
  links:
    - {label: "Code", href: "https://github.com/jnheinrich451-eng/Recover-Retarget-Guide"}
  teaser: {pair: "000000000265.2.005/vehicle", note: "The running example: the reference clip and our result, seed 0."}

stages:
  - name: Recover
    text: >
      The reference video is lifted to a camera trajectory, a subject path and a ground plane in one frame and one scale, with
      a frozen 3D tracker. Static background and moving subject are told apart by a drift model, the subject is masked
      without a human prompt, and a clip whose camera, subject or support surface cannot be recovered is refused.
  - name: Retarget
    text: >
      A proxy of the target category is placed where the source subject stood, facing its heading on its ground; a depth
      control built from that placement drives a depth-conditioned image generator; the anchor image is selected
      automatically and reconstructed in three dimensions.
  - name: Guide
    text: >
      The anchor's own content is rendered along the recovered camera path, and for rigid targets the object along the
      subject's path. Inside a window of noise levels, the frozen generator's clean estimate is corrected toward that render
      wherever a mask marks it reliable. One encode, no gradient, sixteen of fifty steps.

results:
  intro: >
    Fifteen pairs passed a screening fixed before any video was generated: thirteen MiraData clips and two DAVIS clips, each
    with a human or vehicle target set by its caption. Every pair was generated once (seed 0, 21 frames) by the backbone,
    Wan2.1 image-to-video, and by the same backbone with our correction. The two primary metrics were fixed before scoring:
    the camera's rotation error against the reference camera (degrees) and the subject's on-screen path error relative to
    its own first frame (pixels). Lower is better for both.
  reading: >
    The camera result holds on every pair. The subject's path is not transferred on the human pairs, whose arm renders no
    object: once the camera is held, the model's own subject motion is carried along with it. The three vehicle pairs, whose
    arm renders the object along its path, win both.

